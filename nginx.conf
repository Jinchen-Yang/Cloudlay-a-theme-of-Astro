server {
    listen 80;
    server_name localhost;
    
    # 网站根目录
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip 压缩（保持开启，速度快）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # 🟢【关键修改】添加 CSP 头，允许 unsafe-eval
    # 解释：
    # script-src: 允许本地脚本('self')，允许内联脚本('unsafe-inline')，允许动态执行('unsafe-eval')，允许加载 https 的外部脚本
    # img-src: 允许加载 https 图片(如 Bing 壁纸) 和 base64 图片(data:)
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https:;" always;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 路由重定向（解决 Astro 单页应用刷新 404 问题）
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
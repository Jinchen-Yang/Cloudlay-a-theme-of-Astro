name: Deploy to Cloud

on:
  push:
    branches: [ "main" ] # 确保你的主分支叫 main，如果是 master 请修改

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - uses: actions/checkout@v4

      # 2. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 构建并推送镜像
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-astro-blog:latest

      # 4. SSH 登录服务器并更新
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 停止旧容器
            docker stop blog-container || true
            docker rm blog-container || true
            # 删除旧镜像（清理空间）
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/my-astro-blog:latest || true
            # 拉取新镜像
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-astro-blog:latest
            # 启动新容器
            docker run -d --name blog-container --restart always -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/my-astro-blog:latest